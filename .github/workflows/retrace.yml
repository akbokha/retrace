# Runs Retrace on this repo's own PRs (dogfooding). Copy this file into any repo to use it there,
# replacing `uses: ./` with `uses: akbokha/retrace@v0`.
name: Retrace

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: retrace-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  retrace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
